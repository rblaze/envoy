admin:
  address:
    socket_address:
      protocol: TCP
      address: 0.0.0.0
      port_value: 9901
static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          generate_request_id: true
          stat_prefix: ingress_http
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:
              - match:
                  path: "/chat/completions"
                route:
                  cluster: dynamic_forward_proxy_cluster
                request_headers_to_add:
                - header:
                    key: "anthropic-version"
                    value: "2023-06-01"
                  append_action: ADD_IF_ABSENT
                typed_per_filter_config:
                  envoy.filters.http.ai_protocol_manager:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request:
                      llm_protocol: OPENAI_CHAT_COMPLETIONS
                  envoy.filters.http.set_filter_state:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.set_filter_state.v3.Config
                    on_request_headers:
                    - object_key: "envoy.ai.llm_protocol.response"
                      format_string:
                        text_format_source:
                          inline_string: ANTHROPIC_MESSAGES
                          # inline_string: OPENAI_CHAT_COMPLETIONS
                    - object_key: "envoy.ai.uri_pattern.response"
                      format_string:
                        text_format_source:
                          inline_string: /v1/messages
              - match:
                  prefix: "/"
                route:
                  cluster: dynamic_forward_proxy_cluster
          http_filters:
          - name: envoy.filters.http.set_filter_state
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.set_filter_state.v3.Config
              # Placeholder for per-route overrides
          - name: envoy.filters.http.ai_protocol_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManager
              request_handling: {}
              filters:
              - name: envoy.http.ai_filters.schema_validation
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.ai_filters.schema_validation.v3.SchemaValidation
              - name: envoy.http.ai_filters.request_info
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.ai_filters.request_info.v3.RequestInfo
              - name: envoy.http.ai_filters.model_router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.ai_filters.model_router.v3.ModelRouter
                  routes:
                  - requested_model: "claude-haiku-5-5"
                    destinations:
                    - llm_protocol: ANTHROPIC_MESSAGES
                      model: "claude-haiku-5-5"
                      host_and_port: "api.anthropic.com"
                      base_path: "/v1/messages"
          - name: envoy.filters.http.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
              dns_cache_config:
                name: dynamic_forward_proxy_cache_config
                dns_lookup_family: V4_ONLY
                # DNS Cache Circuit Breaker Configuration
                dns_cache_circuit_breaker:
                  max_pending_requests: 1024
                typed_dns_resolver_config:
                  name: envoy.network.dns_resolver.cares
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.network.dns_resolver.cares.v3.CaresDnsResolverConfig
                    resolvers:
                    - socket_address:
                        address: "8.8.8.8"
                        port_value: 53
                    dns_resolver_options:
                      use_tcp_for_dns_lookups: true
                      no_default_search_domain: true
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              upstream_http_filters:
              - name: envoy.filters.http.ai_protocol_manager
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManager
                  request_handling: {}
                  filters:
                  - name: envoy.http.ai_filters.transcoder
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.http.ai_filters.transcoder.v3.Transcoder
                      request_handling: TO_IR
                      response_handling: FROM_IR
                  - name: envoy.http.ai_filters.transcoder
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.http.ai_filters.transcoder.v3.Transcoder
                      request_handling: FROM_IR
                      response_handling: TO_IR
              - name: envoy.filters.http.upstream_codec
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
  clusters:
  - name: dynamic_forward_proxy_cluster
    lb_policy: CLUSTER_PROVIDED
    # Standard Cluster Circuit Breaker Configuration
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 1024
        max_pending_requests: 1024
        max_requests: 1024
        max_retries: 3
    cluster_type:
      name: envoy.clusters.dynamic_forward_proxy
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
        dns_cache_config:
          name: dynamic_forward_proxy_cache_config
          dns_lookup_family: V4_ONLY
          # DNS Cache Circuit Breaker Configuration (same as above)
          dns_cache_circuit_breaker:
            max_pending_requests: 1024
          typed_dns_resolver_config:
            name: envoy.network.dns_resolver.cares
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.network.dns_resolver.cares.v3.CaresDnsResolverConfig
              resolvers:
              - socket_address:
                  address: "8.8.8.8"
                  port_value: 53
              dns_resolver_options:
                use_tcp_for_dns_lookups: true
                no_default_search_domain: true
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        common_tls_context:
          # Explicitly accept untrusted/self-signed certificates
          validation_context:
            trust_chain_verification: ACCEPT_UNTRUSTED
