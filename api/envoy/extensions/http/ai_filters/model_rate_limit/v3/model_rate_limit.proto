syntax = "proto3";

package envoy.extensions.http.ai_filters.model_rate_limit.v3;

import "envoy/config/core/v3/extension.proto";
import "envoy/config/core/v3/grpc_service.proto";

import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";

import "xds/annotations/v3/status.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.http.ai_filters.model_rate_limit.v3";
option java_outer_classname = "ModelRateLimitProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/http/ai_filters/model_rate_limit/v3;model_rate_limitv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;
option (xds.annotations.v3.file_status).work_in_progress = true;

// [#protodoc-title: Model Rate Limit AI filter]
// ModelRateLimit AI filter :ref:`configuration overview
// <config_http_filters_ai_protocol_manager_ai_filters>`.
// [#extension: envoy.http.ai_filters.model_rate_limit]

// Time window unit for evaluating model usage quotas.
enum TimeUnit {
  // Unspecified time unit.
  TIME_UNSPECIFIED = 0;

  // One-minute rolling window.
  MINUTE = 1;

  // One-hour rolling window.
  HOUR = 2;

  // One-day (24-hour) rolling window.
  DAY = 3;
}

// Type of usage metric tracked by a model quota.
enum QuotaType {
  // Unspecified quota type.
  QUOTA_UNSPECIFIED = 0;

  // Total number of requests sent to the model.
  REQUESTS = 1;

  // Total number of input and output tokens consumed by the model.
  TOKENS = 2;
}

// Defines a usage limit for a model over a rolling time window.
message Quota {
  // The metric counted by this quota (requests or tokens).
  QuotaType quota_type = 1 [(validate.rules).enum = {defined_only: true not_in: 0}];

  // The rolling time window over which usage is aggregated.
  TimeUnit time_unit = 2 [(validate.rules).enum = {defined_only: true not_in: 0}];

  // Maximum allowed usage within the time window. Setting ``limit`` to ``0`` disables the model.
  uint32 limit = 3;

  // The number of time units in the quota window. For example, a value of ``6`` with a
  // ``time_unit`` of ``HOUR`` specifies a 6-hour rolling window. If not specified, defaults to
  // ``1``.
  google.protobuf.UInt32Value unit_multiplier = 4 [(validate.rules).uint32 = {gt: 0}];
}

// Associates usage quotas with a specific upstream provider and model.
message ModelLimit {
  // The name of the :ref:`Provider
  // <envoy_v3_api_msg_extensions.http.ai_filters.model_router.v3.Provider>` hosting this model,
  // matching the ``envoy.ai.provider`` filter state object.
  string provider = 1 [(validate.rules).string = {min_len: 1}];

  // Upstream model identifier sent to the provider (e.g., ``gpt-4o``,
  // ``claude-3-5-sonnet-20241022``, or ``gemini-1.5-pro``), matching the
  // ``envoy.ai.model.resolved`` filter state object.
  string model = 2 [(validate.rules).string = {min_len: 1}];

  // Usage quotas enforced for this model. If any configured quota is reached or exceeded, the
  // request is rejected with ``429 Too Many Requests``.
  repeated Quota quotas = 3;
}

// Configuration for tracking model usage quotas locally in memory.
message LocalQuotaConfig {
}

// Configuration for tracking model usage quotas via an external gRPC RateLimitService (RLS).
message RlsQuotaConfig {
  // Specifies the gRPC service that hosts the rate limit service.
  config.core.v3.GrpcService grpc_service = 1 [(validate.rules).message = {required: true}];

  // The rate limit domain to use when calling the rate limit service.
  // If unset, defaults to ``ai_model_routing``.
  string domain = 2;

  // The timeout for rate limit service gRPC calls. If unset, defaults to 1000ms.
  google.protobuf.Duration timeout = 3 [(validate.rules).duration = {gt {}}];
}

// Configuration for the Model Rate Limit AI filter.
message ModelRateLimit {
  // Limits for some or all models.
  // For local quotas, this list is the source of truth. Models not in the list can be used without
  // limits. For RLS quotas, quotas are normally configured in the RLS config; this list serves as
  // an override and can be empty.
  repeated ModelLimit limits = 1;

  // Backend configuration (e.g., :ref:`LocalQuotaConfig
  // <envoy_v3_api_msg_extensions.http.ai_filters.model_rate_limit.v3.LocalQuotaConfig>` or
  // :ref:`RlsQuotaConfig
  // <envoy_v3_api_msg_extensions.http.ai_filters.model_rate_limit.v3.RlsQuotaConfig>`).
  config.core.v3.TypedExtensionConfig backend = 2 [(validate.rules).message = {required: true}];
}
